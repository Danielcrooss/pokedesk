<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de builds Pokémon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#10131c;--card:#1a1e2b;--card2:#222737;--ink:#eef1f8;--mute:#8d96b0;--line:#2c3246;--acc:#4da3ff;--accink:#08111f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Poppins",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:1.7rem;font-weight:700;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 16px}
input{width:100%;font:inherit;padding:13px 16px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.head img{width:96px;height:96px}
.head h2{margin:0 0 4px;font-size:1.5rem;font-weight:700}
.tp{display:inline-block;min-width:64px;text-align:center;padding:1px 10px;border-radius:5px;font-size:.78rem;font-weight:600;color:#fff;background:#667;margin-right:6px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.stat{display:grid;grid-template-columns:40px 1fr 34px;gap:8px;align-items:center;font-size:.82rem;margin-top:4px}
.bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 12px}
.tab{flex:1 1 120px;padding:9px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:600 .9rem "Poppins",system-ui,sans-serif;cursor:pointer}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
h3{margin:0 0 10px;font-size:.95rem;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(40px,1fr) 46px;gap:8px;align-items:center;margin:6px 0;font-size:.88rem}
.row .nm{display:flex;align-items:center;gap:8px;min-width:0}
.row .nm b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pc{text-align:right;color:var(--mute);font-size:.82rem}
.row img{width:24px;height:24px;image-rendering:pixelated}
.ci{width:22px;height:22px;flex:none}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
.layout aside{position:sticky;top:12px;margin-bottom:0}
@media(max-width:900px){.layout{grid-template-columns:1fr}.layout aside{position:static}}
.ev{display:block;white-space:normal;color:var(--mute);font-size:.78rem;line-height:1.35}
.mate{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:4px 2px;color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer;text-align:left}
.mate:last-child{border-bottom:0}
.mate:hover{background:var(--card2)}
.mate img,.mate .ph{width:48px;height:48px;flex:none;image-rendering:pixelated}
.mate .mn{flex:1;min-width:0}
.mate small{color:var(--mute)}
h4{margin:14px 0 8px;font-size:.85rem;font-weight:600;color:var(--acc)}
.set{border-left:3px solid var(--acc);padding-left:10px;margin:0 0 12px;font-size:.9rem}
.set b{display:block;font-weight:600}
.set span{display:block;font-size:.82rem;color:var(--mute);line-height:1.45}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer;margin:0 6px 6px 0}
.chip small{color:var(--mute);margin-left:4px}
.mute{color:var(--mute);font-size:.85rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.row .nm b{white-space:normal}.tp{min-width:54px;font-size:.72rem}}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>Buscador de builds Pokémon</h1>
<p class="sub">Digite o nome, escolha o formato e veja golpes, itens, natureza e companheiros de time.</p>
<input id="q" list="names" placeholder="Ex.: Garchomp" aria-label="Nome do Pokémon" autocomplete="off">
<datalist id="names"></datalist>
<div id="out"></div>
<p class="mute" id="foot"></p>
</main>
<script>
const STATS_FILE = k => `data/${k}.json`;
const POKEAPI = "https://pokeapi.co/api/v2";
const ITEM_IMG = n => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${n}.png`;
const GAME = "scarlet-violet";

const NS = ["PS","Atq","Def","SpA","SpD","Vel"];
const TC = {normal:"#9fa19f",fire:"#e8622a",water:"#4592e6",electric:"#e8b800",grass:"#3fa129",ice:"#3dcef3",fighting:"#d3425f",poison:"#9f5bd0",ground:"#a97a4a",flying:"#7fa4e8",psychic:"#ee6b7a",bug:"#8fa31b",rock:"#b8a86e",ghost:"#6c5aa8",dragon:"#4f60e2",dark:"#5b5466",steel:"#5a8ea5",fairy:"#ee90e6"};
const MODES = [["vgc","VGC Champions"],["vgcsv","VGC Scarlet/Violet"],["singles","Singles"],["casual","Casual"]];
const $ = id => document.getElementById(id);
const cache = new Map();
const j = async u => { if (cache.has(u)) return cache.get(u); const r = await fetch(u); if (!r.ok) throw new Error(r.status); const d = await r.json(); cache.set(u, d); return d; };
const pretty = s => s.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => s.toLowerCase().replace(/['’.]/g, "").replace(/\s+/g, "-");
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");
const badge = t => `<span class="tp" style="${TC[t] ? "background:" + TC[t] : ""}">${t ? esc(pretty(t)) : "?"}</span>`;

const CI = {
  physical: ["Físico", "#e8622a", '<path d="M12 3.5l2.4 5.6 6.1.6-4.6 4 1.4 6L12 16.6 6.7 19.7l1.4-6-4.6-4 6.1-.6z" fill="#fff"/>'],
  special: ["Especial", "#4592e6", '<circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="2.2" fill="#fff"/>'],
  status: ["Status", "#8d96b0", '<rect x="5.5" y="10.5" width="13" height="3" rx="1.5" fill="#fff"/>']
};
const cls = c => { const x = CI[c]; return x ? `<span title="${x[0]}" style="display:inline-flex"><svg class="ci" viewBox="0 0 24 24" role="img" aria-label="${x[0]}"><circle cx="12" cy="12" r="11.5" fill="${x[1]}"/>${x[2]}</svg></span>` : ""; };
const enName = (o, fb) => ((o.names || []).find(n => n.language.name === "en") || {}).name || fb;
const idx = {};
const index = kind => idx[kind] || (idx[kind] = j(`${POKEAPI}/${kind}?limit=3000`).then(d => Object.fromEntries(d.results.map(r => [norm(r.name), r.name]))).catch(() => { delete idx[kind]; return {}; }));

const sprite = async name => { const sl = slug(name); for (const id of [sl, sl.split("-")[0]]) { try { return (await j(`${POKEAPI}/pokemon/${id}`)).sprites.front_default || ""; } catch (e) {} } return ""; };
const fmtName = f => { const m = f.match(/^gen9vgc(\d{4})reg([a-z]+)$/); return m ? `VGC ${m[1]} Reg ${m[2].toUpperCase()}` : f === "gen9doublesou" ? "Doubles OU" : f.replace(/^gen9/, "").toUpperCase(); };
async function strategies(kind, name) {
  let raw; try { raw = await j("data/strategies.json"); } catch (e) { return ""; }
  const grp = raw[kind === "singles" ? "singles" : "vgcsv"] || {};
  const key = Object.keys(grp).find(k => norm(k) === norm(name));
  const note = kind === "vgc" ? '<p class="mute">O Smogon não publica estratégias para o Champions. Estes são os sets de Scarlet/Violet, como referência: golpes e itens podem não existir no Champions.</p>' : "";
  const link = `<p class="mute" style="margin-bottom:0">Análise completa no <a href="https://www.smogon.com/dex/sv/pokemon/${slug(name)}/" target="_blank" rel="noopener">Smogon Strategy Dex</a>.</p>`;
  if (!key) return `<div class="card"><h3>Estratégias (Smogon)</h3>${note}<p class="mute">Sem sets do Smogon para este Pokémon neste formato.</p>${link}</div>`;
  const body = grp[key].map(g => `<h4>${esc(fmtName(g.format))}</h4>` + g.sets.map(s => `<div class="set"><b>${esc(s.name)}</b>
    <span>${[s.item && "Item: " + s.item, s.ability && "Habilidade: " + s.ability, s.nature && "Natureza: " + s.nature, s.tera && "Tera: " + s.tera].filter(Boolean).map(esc).join(" · ")}</span>
    ${s.evs ? `<span>EVs: ${esc(s.evs)}</span>` : ""}<span>Golpes: ${s.moves.map(esc).join(", ")}</span></div>`).join("")).join("");
  return `<div class="card"><h3>Estratégias (Smogon)</h3>${note}${body}${link}</div>`;
}
let mon = null, mode = "vgc";

/* ---------- Dados competitivos ---------- */
const pick = (o, ...ks) => { for (const k of ks) if (o && o[k]) return o[k]; return {}; };
const topN = (o, c, n) => {
  const e = Object.entries(o).filter(([k, v]) => k && k.toLowerCase() !== "nothing" && v > 0).sort((a, b) => b[1] - a[1]);
  const s = e.reduce((t, x) => t + x[1], 0) || 1;
  return e.slice(0, c).map(([k, v]) => ({ k, share: Math.min(1, v / (n || s)) }));
};

async function loadStats(kind, name) {
  let raw;
  try { raw = await j(STATS_FILE(kind)); }
  catch (e) { throw new Error("o arquivo data/" + kind + ".json ainda não existe"); }
  const key = Object.keys(raw.data).find(k => norm(k) === norm(name));
  if (!key) throw new Error("sem dados deste Pokémon em " + raw.format + ", " + raw.month);
  return { format: raw.format + ", " + raw.month, d: raw.data[key] };
}

const pct = x => Math.round(x * 100) + "%";
const line = (nm, share) => `<div class="row"><span class="nm">${nm}</span><div class="bar"><i style="width:${Math.round(share * 100)}%"></i></div><span class="pc">${pct(share)}</span></div>`;
const none = '<p class="mute">Sem dados.</p>';

async function competitive(kind) {
  const { format, d } = await loadStats(kind, pretty(mon.name));
  const n = d.n, L = (key, c) => topN(pick(d, key, key.toLowerCase()), c, n);
  const moves = L("Moves", 8), items = L("Items", 6), abils = L("Abilities", 3);
  const [mi, ii, ai] = await Promise.all([index("move"), index("item"), index("ability")]);
  const look = async (kind, map, key) => { const s = map[norm(key)]; if (!s) return null; try { return { s, o: await j(`${POKEAPI}/${kind}/${s}`) }; } catch (e) { return null; } };
  const [md, idd, ad] = await Promise.all([
    Promise.all(moves.map(m => look("move", mi, m.k))),
    Promise.all(items.map(i => look("item", ii, i.k))),
    Promise.all(abils.map(a => look("ability", ai, a.k)))]);
  const cap = k => k.charAt(0).toUpperCase() + k.slice(1);
  const mRows = moves.map((m, x) => { const r = md[x]; return line(r ? `${badge(r.o.type.name)}${cls(r.o.damage_class.name)}<b>${esc(enName(r.o, pretty(r.s)))}</b>` : `<b>${esc(cap(m.k))}</b>`, m.share); }).join("") || none;
  const iRows = items.map((i, x) => { const r = idd[x]; const img = r ? (r.o.sprites.default || ITEM_IMG(r.s)) : ""; return line(`${img ? `<img src="${img}" alt="" onerror="this.style.visibility='hidden'">` : ""}<b>${esc(r ? enName(r.o, pretty(r.s)) : cap(i.k))}</b>`, i.share); }).join("") || none;
  const aRows = abils.map((a, x) => { const r = ad[x]; return line(`<b>${esc(r ? enName(r.o, pretty(r.s)) : cap(a.k))}</b>`, a.share); }).join("") || none;
  const sRows = L("Spreads", 4).map(x => {
    const [nat, ev] = x.k.split(":"), v = (ev || "").split("/").map(Number);
    const evs = v.map((q, i) => q ? q + " " + NS[i] : "").filter(Boolean).join(" / ");
    return line(`<span style="display:block;min-width:0"><b>${esc(nat)}</b><span class="ev">${esc(evs)}</span></span>`, x.share);
  }).join("") || none;
  const mateList = L("Teammates", 10);
  const sprites = await Promise.all(mateList.map(x => sprite(x.k)));
  const mates = mateList.map((x, i) => `<button class="mate" data-n="${esc(x.k)}">${sprites[i] ? `<img src="${sprites[i]}" alt="">` : '<i class="ph"></i>'}<span class="mn">${esc(x.k)}</span><small>${pct(x.share)}</small></button>`).join("") || none;
  const strat = await strategies(kind, pretty(mon.name));
  return `<div class="layout"><div>
  <p class="mute">Fonte: estatísticas do Smogon, formato ${esc(format)}.</p>
  <div class="grid">
   <div class="card"><h3>Golpes</h3>${mRows}</div>
   <div class="card"><h3>Itens</h3>${iRows}</div>
   <div class="card"><h3>Habilidades</h3>${aRows}</div>
   <div class="card"><h3>Natureza e EVs</h3>${sRows}</div>
  </div>${strat}</div>
  <aside class="card"><h3>Companheiros de time</h3>${mates}</aside></div>`;
}

/* ---------- Modo casual (calculado com a PokéAPI) ---------- */
async function casual() {
  const types = mon.types.map(t => t.type.name);
  const best = mon.stats[1].base_stat >= mon.stats[3].base_stat ? "physical" : "special";
  const learn = mon.moves.filter(m => m.version_group_details.some(v => v.version_group.name === GAME && v.move_learn_method.name === "level-up")).slice(0, 40);
  const mv = (await Promise.all(learn.map(m => j(m.move.url).catch(() => null)))).filter(x => x && x.power);
  const score = m => m.power * (types.includes(m.type.name) ? 1.5 : 1) * (m.damage_class.name === best ? 1 : .6) * (m.accuracy ? m.accuracy / 100 : 1);
  mv.sort((a, b) => score(b) - score(a));
  const chosen = [], used = new Set();
  for (const m of mv) { if (chosen.length >= 4) break; if (!used.has(m.type.name) || chosen.length >= 2) { chosen.push(m); used.add(m.type.name); } }
  const rel = await Promise.all(types.map(t => j(`${POKEAPI}/type/${t}`)));
  const mult = {};
  rel.forEach(r => { r.damage_relations.double_damage_from.forEach(x => mult[x.name] = (mult[x.name] || 1) * 2); r.damage_relations.half_damage_from.forEach(x => mult[x.name] = (mult[x.name] || 1) * .5); r.damage_relations.no_damage_from.forEach(x => mult[x.name] = 0); });
  const weak = Object.keys(mult).filter(t => mult[t] > 1);
  const tr = await Promise.all(Object.keys(TC).map(t => j(`${POKEAPI}/type/${t}`)));
  const cover = tr.filter(t => { const half = [...t.damage_relations.half_damage_from, ...t.damage_relations.no_damage_from].map(x => x.name); return weak.length && weak.filter(w => half.includes(w)).length >= Math.max(1, weak.length - 1); }).map(t => t.name);
  const abil = mon.abilities.map(a => pretty(a.ability.name) + (a.is_hidden ? " (oculta)" : ""));
  return `<p class="mute">Sugestão automática a partir dos golpes que ele aprende por nível em ${esc(pretty(GAME))}. Não vem de estatísticas de jogadores.</p>
  <div class="grid">
   <div class="card"><h3>Golpes sugeridos</h3>${chosen.map(m => `<div class="row" style="grid-template-columns:1fr auto"><span class="nm">${badge(m.type.name)}${cls(m.damage_class.name)}<b>${esc(enName(m, pretty(m.name)))}</b></span><span class="pc">poder ${m.power}</span></div>`).join("") || none}</div>
   <div class="card"><h3>Habilidades</h3><p style="margin:0">${abil.map(esc).join("<br>")}</p><h3 style="margin-top:14px">Fraco contra</h3><div>${weak.map(t => badge(t) + '<span class="mute">×' + mult[t] + '</span> ').join("") || "Nada"}</div></div>
  </div>
  <div class="card"><h3>Tipos que cobrem suas fraquezas</h3><div>${cover.map(badge).join("") || "—"}</div></div>`;
}

/* ---------- Tela ---------- */
function shell() {
  const m = mon, img = m.sprites.other["official-artwork"].front_default || m.sprites.front_default;
  return `<div class="card"><div class="head"><img src="${img}" alt="${esc(pretty(m.name))}"><div><h2>${esc(pretty(m.name))}</h2><div>${m.types.map(t => badge(t.type.name)).join("")}</div></div></div>
  ${m.stats.map((s, i) => `<div class="stat"><span>${NS[i]}</span><div class="bar"><i style="width:${Math.min(100, s.base_stat / 1.6)}%"></i></div><b>${s.base_stat}</b></div>`).join("")}</div>
  <div class="tabs" role="tablist">${MODES.map(x => `<button class="tab" role="tab" data-m="${x[0]}" aria-selected="${x[0] === mode}">${x[1]}</button>`).join("")}</div><div id="tab"></div>`;
}

async function renderTab() {
  const t = $("tab"), my = ++renderTab.id; t.innerHTML = '<p class="mute">Carregando…</p>';
  let html;
  try { html = mode === "casual" ? await casual() : await competitive(mode); }
  catch (e) { html = `<div class="card">Não foi possível carregar os dados competitivos (${esc(e.message)}). Veja direto no <a href="https://www.pikalytics.com/pokedex" target="_blank" rel="noopener">Pikalytics</a>.</div>`; }
  if (my === renderTab.id) t.innerHTML = html;
}
renderTab.id = 0;

async function show(raw) {
  const id = raw.trim().toLowerCase().replace(/\s+/g, "-");
  if (!id) return;
  $("out").innerHTML = '<p class="mute">Buscando…</p>';
  try { mon = await j(`${POKEAPI}/pokemon/${id}`); }
  catch { $("out").innerHTML = `<div class="card">Não encontrei "${esc(raw)}". Confira o nome (em inglês).</div>`; return; }
  $("q").value = pretty(mon.name);
  $("out").innerHTML = shell(); renderTab();
}

document.addEventListener("click", e => {
  const n = e.target.closest("[data-n]"), t = e.target.closest("[data-m]");
  if (n) show(n.dataset.n);
  if (t && mon) { mode = t.dataset.m; document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.m === mode)); renderTab(); }
});
$("q").addEventListener("keydown", e => { if (e.key === "Enter") show($("q").value); });
$("q").addEventListener("change", () => show($("q").value));

j(`${POKEAPI}/pokemon?limit=1100`).then(d => { $("names").innerHTML = d.results.map(r => `<option value="${esc(pretty(r.name))}">`).join(""); }).catch(() => {});
$("foot").innerHTML = 'Dados: <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a> e estatísticas do <a href="https://www.smogon.com/stats/" target="_blank" rel="noopener">Smogon</a>.';
</script>
</body>
</html>
