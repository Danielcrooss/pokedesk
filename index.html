<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de builds Pokémon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#10131c;--card:#1a1e2b;--card2:#222737;--ink:#eef1f8;--mute:#8d96b0;--line:#2c3246;--acc:#4da3ff;--accink:#08111f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Poppins",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:1.7rem;font-weight:700;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 16px}
input{width:100%;font:inherit;padding:13px 16px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.head img{width:96px;height:96px}
.head h2{margin:0 0 4px;font-size:1.5rem;font-weight:700}
.tp{display:inline-block;min-width:64px;text-align:center;padding:1px 10px;border-radius:5px;font-size:.78rem;font-weight:600;color:#fff;background:#667;margin-right:6px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.stat{display:grid;grid-template-columns:40px 1fr 34px;gap:8px;align-items:center;font-size:.82rem;margin-top:4px}
.bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 12px}
.tab{flex:1 1 120px;padding:9px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:600 .9rem "Poppins",system-ui,sans-serif;cursor:pointer}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
h3{margin:0 0 10px;font-size:.95rem;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(40px,1fr) 46px;gap:8px;align-items:center;margin:6px 0;font-size:.88rem}
.row .nm{display:flex;align-items:center;gap:8px;min-width:0}
.row .nm b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pc{text-align:right;color:var(--mute);font-size:.82rem}
.row img{width:24px;height:24px;image-rendering:pixelated}
.ci{width:22px;height:22px;flex:none}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
.layout aside{position:sticky;top:12px;margin-bottom:0}
@media(max-width:900px){.layout{grid-template-columns:1fr}.layout aside{position:static}}
.ev{display:block;white-space:normal;color:var(--mute);font-size:.78rem;line-height:1.35}
.mate{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:4px 2px;color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer;text-align:left}
.mate:last-child{border-bottom:0}
.mate:hover{background:var(--card2)}
.mate img,.mate .ph{width:48px;height:48px;flex:none;image-rendering:pixelated}
.mate .mn{flex:1;min-width:0}
.mate small{color:var(--mute)}
h4{margin:14px 0 8px;font-size:.85rem;font-weight:600;color:var(--acc)}
.set{border-left:3px solid var(--acc);padding-left:10px;margin:0 0 12px;font-size:.9rem}
.set b{display:block;font-weight:600}
.set>span{display:block;font-size:.82rem;color:var(--mute);line-height:1.45}
.evo{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.lvrow{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.lvl{width:44px;flex:none}
.mvgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 8px}
.mvgrid .mvchip{margin:0;min-width:0}
.mvrow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.mvrow .mvchip{margin:0}
.mvrow .tp{margin:0}
@media(max-width:480px){.mvgrid{grid-template-columns:1fr}}
.mvchip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:2px 8px 2px 4px;margin:0 6px 6px 0;font-size:.82rem}
.mvchip .tp{min-width:0;margin:0;padding:0 6px;font-size:.7rem}
.mvchip .ci{width:18px;height:18px}
.hd{padding:12px 14px}
.top{display:flex;align-items:center;gap:12px}
.top img{width:84px;height:84px;object-fit:contain}
.hr h2{margin:0 0 4px;font-size:1.3rem;font-weight:700}
.hr h2 small{font-size:.8rem;font-weight:400}
.mid{display:grid;grid-template-columns:230px 1fr;gap:16px;margin-top:10px;align-items:start}
.sts .s{display:grid;grid-template-columns:34px 30px 1fr;gap:8px;align-items:center;font-size:.8rem;margin:3px 0}
.sts .s b{font-size:.85rem;text-align:right}
.sts .bar{height:6px}
.bubble{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.88rem;line-height:1.5;align-self:stretch;display:flex;align-items:center}
.bubble::before{content:"";position:absolute;left:-9px;top:20px;border:8px solid transparent;border-left:0;border-right-color:var(--line)}
.bubble::after{content:"";position:absolute;left:-7px;top:21px;border:7px solid transparent;border-left:0;border-right-color:var(--card2)}
.bubble p{margin:0}
.where{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.wh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;font-size:.9rem}
select{font:inherit;font-size:.85rem;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink);max-width:62%}
.locs{max-height:130px;overflow:auto}
.loc{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;padding:2px 0;border-bottom:1px solid var(--line)}
.loc b{font-weight:500}
.tg{display:inline-block;font-size:.68rem;padding:0 7px;border-radius:99px;margin-left:6px;background:var(--card2);border:1px solid var(--line);color:var(--mute)}
.tg.dlc{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:600}
@media(max-width:560px){.mid{grid-template-columns:1fr}.bubble::before,.bubble::after{display:none}.loc{flex-direction:column;gap:0}}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer;margin:0 6px 6px 0}
.chip small{color:var(--mute);margin-left:4px}
.mute{color:var(--mute);font-size:.85rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.row .nm b{white-space:normal}.tp{min-width:54px;font-size:.72rem}}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<h1>Buscador de builds Pokémon</h1>
<p class="sub">Digite o nome, escolha o formato e veja golpes, itens, natureza e companheiros de time.</p>
<input id="q" list="names" placeholder="Ex.: Garchomp" aria-label="Nome do Pokémon" autocomplete="off">
<datalist id="names"></datalist>
<div id="out"></div>
<p class="mute" id="foot"></p>
</main>
<script>
const STATS_FILE = k => `data/${k}.json`;
const POKEAPI = "https://pokeapi.co/api/v2";
const ITEM_IMG = n => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${n}.png`;
const GAME = "scarlet-violet";

const NS = ["PS","Atq","Def","SpA","SpD","Vel"];
const TC = {normal:"#9fa19f",fire:"#e8622a",water:"#4592e6",electric:"#e8b800",grass:"#3fa129",ice:"#3dcef3",fighting:"#d3425f",poison:"#9f5bd0",ground:"#a97a4a",flying:"#7fa4e8",psychic:"#ee6b7a",bug:"#8fa31b",rock:"#b8a86e",ghost:"#6c5aa8",dragon:"#4f60e2",dark:"#5b5466",steel:"#5a8ea5",fairy:"#ee90e6"};
const MODES = [["vgc","VGC Champions"],["vgcsv","VGC Scarlet/Violet"],["singles","Singles"],["casual","Casual"]];
const $ = id => document.getElementById(id);
const cache = new Map();
const j = async u => { if (cache.has(u)) return cache.get(u); const r = await fetch(u); if (!r.ok) throw new Error(r.status); const d = await r.json(); cache.set(u, d); return d; };
const pretty = s => s.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => s.toLowerCase().replace(/['’.]/g, "").replace(/\s+/g, "-");
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");
const badge = t => `<span class="tp" style="${TC[t] ? "background:" + TC[t] : ""}">${t ? esc(pretty(t)) : "?"}</span>`;

const CI = {
  physical: ["Físico", "#e8622a", '<path d="M12 3.5l2.4 5.6 6.1.6-4.6 4 1.4 6L12 16.6 6.7 19.7l1.4-6-4.6-4 6.1-.6z" fill="#fff"/>'],
  special: ["Especial", "#4592e6", '<circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12" r="2.2" fill="#fff"/>'],
  status: ["Status", "#8d96b0", '<rect x="5.5" y="10.5" width="13" height="3" rx="1.5" fill="#fff"/>']
};
const cls = c => { const x = CI[c]; return x ? `<span title="${x[0]}" style="display:inline-flex"><svg class="ci" viewBox="0 0 24 24" role="img" aria-label="${x[0]}"><circle cx="12" cy="12" r="11.5" fill="${x[1]}"/>${x[2]}</svg></span>` : ""; };
const enName = (o, fb) => ((o.names || []).find(n => n.language.name === "en") || {}).name || fb;
const idx = {};
const index = kind => idx[kind] || (idx[kind] = j(`${POKEAPI}/${kind}?limit=3000`).then(d => Object.fromEntries(d.results.map(r => [norm(r.name), r.name]))).catch(() => { delete idx[kind]; return {}; }));

const sprite = async name => { const sl = slug(name); for (const id of [sl, sl.split("-")[0]]) { try { return (await j(`${POKEAPI}/pokemon/${id}`)).sprites.front_default || ""; } catch (e) {} } return ""; };
const fmtName = f => { const m = f.match(/^gen9vgc(\d{4})reg([a-z]+)$/); return m ? `VGC ${m[1]} Reg ${m[2].toUpperCase()}` : f === "gen9doublesou" ? "Doubles OU" : f.replace(/^gen9/, "").toUpperCase(); };
async function strategies(kind, name) {
  let raw; try { raw = await j("data/strategies.json"); } catch (e) { return ""; }
  const grp = raw[kind === "singles" ? "singles" : "vgcsv"] || {};
  const key = Object.keys(grp).find(k => norm(k) === norm(name));
  const note = kind === "vgc" ? '<p class="mute">O Smogon não publica estratégias para o Champions. Estes são os sets de Scarlet/Violet, como referência: golpes e itens podem não existir no Champions, e os EVs deles (até 252) usam outra escala que os pontos de status.</p>' : "";
  const link = `<p class="mute" style="margin-bottom:0">Análise completa no <a href="https://www.smogon.com/dex/sv/pokemon/${slug(name)}/" target="_blank" rel="noopener">Smogon Strategy Dex</a>.</p>`;
  if (!key) return `<div class="card"><h3>Estratégias (Smogon)</h3>${note}<p class="mute">Sem sets do Smogon para este Pokémon neste formato.</p>${link}</div>`;
  const body = grp[key].map(g => `<h4>${esc(fmtName(g.format))}</h4>` + g.sets.map(s => `<div class="set"><b>${esc(s.name)}</b>
    <span>${[s.item && "Item: " + s.item, s.ability && "Habilidade: " + s.ability, s.nature && "Natureza: " + s.nature, s.tera && "Tera: " + s.tera].filter(Boolean).map(esc).join(" · ")}</span>
    ${s.evs ? `<span>EVs: ${esc(s.evs)}</span>` : ""}<span>Golpes: ${s.moves.map(esc).join(", ")}</span></div>`).join("")).join("");
  return `<div class="card"><h3>Estratégias (Smogon)</h3>${note}${body}${link}</div>`;
}
const ROLE_PT = { "Fast Attacker": "Atacante rápido", "Setup Sweeper": "Atacante com setup", "Wallbreaker": "Quebra-defesas", "Bulky Attacker": "Atacante resistente", "Bulky Setup": "Setup resistente", "Fast Support": "Suporte rápido", "Bulky Support": "Suporte resistente", "Staller": "Desgaste", "Tera Blast user": "Usuário de Tera Blast", "Offensive Protect": "Protect ofensivo", "Choice Item user": "Usuário de item Choice", "AV Pivot": "Pivô com Assault Vest", "Spinner": "Removedor de hazards", "Doubles Fast Attacker": "Atacante rápido (Doubles)", "Doubles Setup Sweeper": "Atacante com setup (Doubles)", "Doubles Wallbreaker": "Quebra-defesas (Doubles)", "Doubles Bulky Attacker": "Atacante resistente (Doubles)", "Doubles Bulky Setup": "Setup resistente (Doubles)", "Doubles Support": "Suporte (Doubles)", "Baton Pass user": "Usuário de Baton Pass", "Berry Sweeper": "Atacante com berry" };
const trCache = (() => { try { return JSON.parse(localStorage.getItem("trpt1") || "{}"); } catch (e) { return {}; } })();
const decode = s => { const e = document.createElement("textarea"); e.innerHTML = s; return e.value; };
async function tr(t) {
  if (!t) return "";
  if (trCache[t]) return trCache[t];
  try {
    const d = await (await fetch("https://api.mymemory.translated.net/get?langpair=en|pt-BR&q=" + encodeURIComponent(t))).json();
    const out = d && d.responseData && d.responseData.translatedText;
    if (out && Number(d.responseStatus) === 200 && !/MYMEMORY/i.test(out)) {
      const v = decode(out); trCache[t] = v;
      try { localStorage.setItem("trpt1", JSON.stringify(trCache)); } catch (e) {}
      return v;
    }
  } catch (e) {}
  return t;
}
function translateAll(root, my) {
  root.querySelectorAll("[data-tr]").forEach(el => { const txt = el.dataset.tr; tr(txt).then(v => { if (renderTab.id === my && el.dataset.tr === txt) el.textContent = v; }); });
}
let game = "", mon = null, mode = "vgc";

/* ---------- Dados competitivos ---------- */
const pick = (o, ...ks) => { for (const k of ks) if (o && o[k]) return o[k]; return {}; };
const topN = (o, c, n) => {
  const e = Object.entries(o).filter(([k, v]) => k && k.toLowerCase() !== "nothing" && v > 0).sort((a, b) => b[1] - a[1]);
  const s = e.reduce((t, x) => t + x[1], 0) || 1;
  return e.slice(0, c).map(([k, v]) => ({ k, share: Math.min(1, v / (n || s)) }));
};

async function loadStats(kind, name) {
  let raw;
  try { raw = await j(STATS_FILE(kind)); }
  catch (e) { throw new Error("o arquivo data/" + kind + ".json ainda não existe"); }
  const key = Object.keys(raw.data).find(k => norm(k) === norm(name));
  if (!key) throw new Error("sem dados deste Pokémon em " + raw.format + ", " + raw.month);
  return { format: raw.format + ", " + raw.month, d: raw.data[key] };
}

const pct = x => Math.round(x * 100) + "%";
const line = (nm, share) => `<div class="row"><span class="nm">${nm}</span><div class="bar"><i style="width:${Math.round(share * 100)}%"></i></div><span class="pc">${pct(share)}</span></div>`;
const none = '<p class="mute">Sem dados.</p>';

async function competitive(kind) {
  const { format, d } = await loadStats(kind, pretty(mon.name));
  const n = d.n, L = (key, c) => topN(pick(d, key, key.toLowerCase()), c, n);
  const moves = L("Moves", 8), items = L("Items", 6), abils = L("Abilities", 3);
  const [mi, ii, ai] = await Promise.all([index("move"), index("item"), index("ability")]);
  const look = async (kind, map, key) => { const s = map[norm(key)]; if (!s) return null; try { return { s, o: await j(`${POKEAPI}/${kind}/${s}`) }; } catch (e) { return null; } };
  const [md, idd, ad] = await Promise.all([
    Promise.all(moves.map(m => look("move", mi, m.k))),
    Promise.all(items.map(i => look("item", ii, i.k))),
    Promise.all(abils.map(a => look("ability", ai, a.k)))]);
  const cap = k => k.charAt(0).toUpperCase() + k.slice(1);
  const mRows = moves.map((m, x) => { const r = md[x]; return line(r ? `${badge(r.o.type.name)}${cls(r.o.damage_class.name)}<b>${esc(enName(r.o, pretty(r.s)))}</b>` : `<b>${esc(cap(m.k))}</b>`, m.share); }).join("") || none;
  const iRows = items.map((i, x) => { const r = idd[x]; const img = r ? (r.o.sprites.default || ITEM_IMG(r.s)) : ""; return line(`${img ? `<img src="${img}" alt="" onerror="this.style.visibility='hidden'">` : ""}<b>${esc(r ? enName(r.o, pretty(r.s)) : cap(i.k))}</b>`, i.share); }).join("") || none;
  const aRows = abils.map((a, x) => { const r = ad[x]; return line(`<b>${esc(r ? enName(r.o, pretty(r.s)) : cap(a.k))}</b>`, a.share); }).join("") || none;
  const sRows = L("Spreads", 4).map(x => {
    const [nat, ev] = x.k.split(":"), v = (ev || "").split("/").map(Number);
    const evs = v.map((q, i) => q ? q + " " + NS[i] : "").filter(Boolean).join(" / ");
    return line(`<span style="display:block;min-width:0"><b>${esc(nat)}</b><span class="ev">${esc(evs)}</span></span>`, x.share);
  }).join("") || none;
  const mateList = L("Teammates", 10);
  const sprites = await Promise.all(mateList.map(x => sprite(x.k)));
  const mates = mateList.map((x, i) => `<button class="mate" data-n="${esc(x.k)}">${sprites[i] ? `<img src="${sprites[i]}" alt="">` : '<i class="ph"></i>'}<span class="mn">${esc(x.k)}</span><small>${pct(x.share)}</small></button>`).join("") || none;
  const strat = await strategies(kind, pretty(mon.name));
  return `<div class="layout"><div>
  <p class="mute">Fonte: estatísticas do Smogon, formato ${esc(format)}.</p>
  <div class="grid">
   <div class="card"><h3>Golpes</h3>${mRows}</div>
   <div class="card"><h3>Itens</h3>${iRows}</div>
   <div class="card"><h3>Habilidades</h3>${aRows}</div>
   <div class="card"><h3>${kind === "vgc" ? "Natureza e pontos de status" : "Natureza e EVs"}</h3>${kind === "vgc" ? '<p class="mute" style="margin:0 0 6px">No Champions não há EVs: cada status recebe até 32 pontos, somando no máximo 66.</p>' : ""}${sRows}</div>
  </div>${strat}</div>
  <aside class="card"><h3>Companheiros de time</h3>${mates}</aside></div>`;
}

/* ---------- Modo casual (calculado com a PokéAPI) ---------- */
const NAT = { "phys": ["Adamant", "+Atq −SpA"], "phys-fast": ["Jolly", "+Vel −SpA"], "spec": ["Modest", "+SpA −Atq"], "spec-fast": ["Timid", "+Vel −Atq"] };
const TYPE_ITEM = { normal: "silk-scarf", fire: "charcoal", water: "mystic-water", electric: "magnet", grass: "miracle-seed", ice: "never-melt-ice", fighting: "black-belt", poison: "poison-barb", ground: "soft-sand", flying: "sharp-beak", psychic: "twisted-spoon", bug: "silver-powder", rock: "hard-stone", ghost: "spell-tag", dragon: "dragon-fang", dark: "black-glasses", steel: "metal-coat", fairy: "fairy-feather" };

async function evolution() {
  const sp = await j(mon.species.url), ch = await j(sp.evolution_chain.url);
  const cond = d => { const x = (d || [])[0]; if (!x) return ""; const p = [];
    if (x.min_level) p.push("Lv " + x.min_level);
    if (x.item) p.push(pretty(x.item.name));
    if (x.held_item) p.push("segurando " + pretty(x.held_item.name));
    if (x.min_happiness) p.push("amizade");
    if (x.known_move) p.push("sabendo " + pretty(x.known_move.name));
    if (x.time_of_day) p.push(x.time_of_day === "day" ? "de dia" : "de noite");
    if (x.trigger && x.trigger.name === "trade") p.push("troca");
    if (!p.length && x.trigger) p.push(pretty(x.trigger.name));
    return p.join(", "); };
  const paths = [];
  const walk = (n, acc) => { const me = { name: n.species.name, id: n.species.url.split("/").filter(Boolean).pop(), c: cond(n.evolution_details) }; const a = [...acc, me]; if (!n.evolves_to.length) paths.push(a); else n.evolves_to.forEach(k => walk(k, a)); };
  walk(ch.chain, []);
  if (paths.length === 1 && paths[0].length === 1) return '<p class="mute" style="margin:0">Este Pokémon não evolui.</p>';
  return paths.slice(0, 6).map(p => `<div class="evo">${p.map((e, i) => `${i ? `<span class="mute">→ ${esc(e.c)}</span>` : ""}<button class="chip" data-n="${esc(e.name)}"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${e.id}.png" alt="" style="width:32px;height:32px;image-rendering:pixelated;vertical-align:middle"> ${esc(pretty(e.name))}</button>`).join("")}</div>`).join("");
}

async function coverMons(weak, typeData, cover, avail) {
  if (!weak.length || !cover.length) return "";
  const TD = {}; typeData.forEach(t => TD[t.name] = t);
  const pop = {};
  for (const f of ["singles", "vgcsv"]) {
    try { const raw = await j(STATS_FILE(f)); Object.entries(raw.data).forEach(([k, v]) => pop[norm(k)] = v.n || 0); break; } catch (e) {}
  }
  const seen = new Map();
  cover.forEach(t => TD[t].pokemon.forEach(p => { const id = +p.pokemon.url.split("/").filter(Boolean).pop(); if (id <= 1025 && id !== mon.id && (!avail || avail.has(id))) seen.set(p.pokemon.name, p.pokemon.url); }));
  const cands = [...seen].sort((a, b) => (pop[norm(b[0])] || 0) - (pop[norm(a[0])] || 0)).slice(0, 16);
  const data = (await Promise.all(cands.map(c => j(c[1]).catch(() => null)))).filter(Boolean);
  const mul = (types, atk) => types.reduce((m, t) => { const r = TD[t].damage_relations; return m * (r.no_damage_from.some(x => x.name === atk) ? 0 : r.double_damage_from.some(x => x.name === atk) ? 2 : r.half_damage_from.some(x => x.name === atk) ? .5 : 1); }, 1);
  const rows = data.map(p => { const ct = p.types.map(t => t.type.name), res = weak.filter(w => mul(ct, w) < 1), bad = weak.filter(w => mul(ct, w) > 1); return { p, ct, res, score: res.length * 2 - bad.length }; })

}

async function casual() {
  const types = mon.types.map(t => t.type.name), sp = mon.stats.map(s => s.base_stat);

  const [nat, natTxt] = NAT[(phys ? "phys" : "spec") + (fast ? "-fast" : "")];
  const evs = fast ? (phys ? "252 Atq / 252 Vel / 4 PS" : "252 SpA / 252 Vel / 4 PS") : (phys ? "252 PS / 252 Atq / 4 Def" : "252 PS / 252 SpA / 4 SpD");

  mvs.sort((a, b) => score(b) - score(a));
  const chosen = [], used = new Set();
  for (const x of mvs) { if (chosen.length >= 4) break; if (!used.has(x.o.type.name) || chosen.length >= 2) { chosen.push(x); used.add(x.o.type.name); } }
  const itemSlug = TYPE_ITEM[chosen[0] ? chosen[0].o.type.name : types[0]];

  const ab = await Promise.all(mon.abilities.map(a => j(a.ability.url).catch(() => null)));
  const abHtml = mon.abilities.map((a, i) => { const o = ab[i], eff = o && (o.effect_entries.find(e => e.language.name === "en") || {}).short_effect; return `<div style="margin:0 0 8px"><b>${esc(o ? enName(o, pretty(a.ability.name)) : pretty(a.ability.name))}</b>${a.is_hidden ? ' <span class="mute">(oculta)</span>' : ""}${eff ? `<span class="ev" data-tr="${esc(eff)}">${esc(eff)}</span>` : ""}</div>`; }).join("");

  const weak = Object.keys(mult).filter(t => mult[t] > 1);
  const tr = await Promise.all(Object.keys(TC).map(t => j(`${POKEAPI}/type/${t}`)));
  const cover = tr.filter(t => { const half = [...t.damage_relations.half_damage_from, ...t.damage_relations.no_damage_from].map(x => x.name); return weak.length && weak.filter(w => half.includes(w)).length >= Math.max(1, weak.length - 1); }).map(t => t.name);
  const avail = await availSpecies(G()).catch(() => null);
  const covers = await coverMons(weak, tr, cover, avail).catch(() => "");

  const lv = mon.moves.map(m => { const d = m.version_group_details.find(v => v.version_group.name === GAME && v.move_learn_method.name === "level-up"); return d ? [d.level_learned_at, m.move.name, m.move.url] : null; }).filter(Boolean).sort((a, b) => a[0] - b[0]);
  const lvd = await Promise.all(lv.map(x => j(x[2]).catch(() => null)));

  let roles = "";
  try {
    const raw = await j("data/casual.json"), key = Object.keys(raw).find(k => norm(k) === norm(pretty(mon.name)));
    if (key) {
      const [mi, ii, ai] = await Promise.all([index("move"), index("item"), index("ability")]);
      const nm = (map, k) => map[norm(k)] ? pretty(map[norm(k)]) : k;

      const mchip = k => { const o = rm[k]; return o ? `<span class="mvchip">${badge(o.type.name)}${cls(o.damage_class.name)}${esc(enName(o, nm(mi, k)))}</span>` : `<span class="mvchip">${esc(nm(mi, k))}</span>`; };

        <span>Golpes:</span><div class="mvgrid">${r.moves.map(mchip).join("")}</div></div>`).join("")}</div>`;

  const evo = await evolution().catch(() => "");
  return `<p class="mute">Sugestão automática com dados da PokéAPI (golpes de ${esc(pretty(GAME))}) e sets do Random Battle. Não existe API pública de builds para a história, então use como ponto de partida.</p>
  <div class="layout"><div>
   <div class="grid">
    <div class="card"><h3>Build sugerida</h3>
     <div class="row" style="grid-template-columns:1fr"><span class="nm"><b>Natureza: ${nat}</b></span></div><span class="ev">${natTxt}</span>
     <div class="row" style="grid-template-columns:1fr;margin-top:10px"><span class="nm"><b>EVs: ${evs}</b></span></div>
     ${itemSlug ? `<div class="row" style="grid-template-columns:1fr;margin-top:10px"><span class="nm"><img src="${ITEM_IMG(itemSlug)}" alt="" onerror="this.style.visibility='hidden'"><b>Item: ${esc(pretty(itemSlug))}</b></span></div>` : ""}
    </div>
    <div class="card"><h3>Golpes sugeridos</h3>${chosen.map(x => `<div class="row" style="grid-template-columns:1fr auto"><span class="nm">${badge(x.o.type.name)}${cls(x.o.damage_class.name)}<b>${esc(enName(x.o, pretty(x.o.name)))}</b></span><span class="pc">${x.how} · ${x.o.power}</span></div>`).join("") || none}</div>

   <div class="card"><details><summary style="cursor:pointer;color:var(--acc)">Todos os golpes por nível</summary>${lv.map(([l, n], i) => { const o = lvd[i]; return `<div class="lvrow"><span class="mute lvl">Lv ${l || "—"}</span>${o ? badge(o.type.name) + cls(o.damage_class.name) : ""}<span>${esc(o ? enName(o, pretty(n)) : pretty(n))}</span>${o && o.power ? `<span class="mute">· ${o.power}</span>` : ""}</div>`; }).join("") || none}</details></div>

/* ---------- Tela ---------- */
const GNAME = { "lets-go-pikachu": "Let's Go Pikachu", "lets-go-eevee": "Let's Go Eevee", "the-isle-of-armor": "Isle of Armor", "the-crown-tundra": "Crown Tundra", "the-teal-mask": "Teal Mask", "the-indigo-disk": "Indigo Disk", "legends-arceus": "Legends: Arceus", "black-2": "Black 2", "white-2": "White 2" };
const gname = v => GNAME[v] || pretty(v);
const SPR = { red: ["generation-i", "red-blue"], blue: ["generation-i", "red-blue"], yellow: ["generation-i", "yellow"], gold: ["generation-ii", "gold"], silver: ["generation-ii", "silver"], crystal: ["generation-ii", "crystal"], ruby: ["generation-iii", "ruby-sapphire"], sapphire: ["generation-iii", "ruby-sapphire"], emerald: ["generation-iii", "emerald"], firered: ["generation-iii", "firered-leafgreen"], leafgreen: ["generation-iii", "firered-leafgreen"], diamond: ["generation-iv", "diamond-pearl"], pearl: ["generation-iv", "diamond-pearl"], platinum: ["generation-iv", "platinum"], heartgold: ["generation-iv", "heartgold-soulsilver"], soulsilver: ["generation-iv", "heartgold-soulsilver"], black: ["generation-v", "black-white"], white: ["generation-v", "black-white"], "black-2": ["generation-v", "black-white"], "white-2": ["generation-v", "black-white"], x: ["generation-vi", "x-y"], y: ["generation-vi", "x-y"], "omega-ruby": ["generation-vi", "omegaruby-alphasapphire"], "alpha-sapphire": ["generation-vi", "omegaruby-alphasapphire"], sun: ["generation-vii", "ultra-sun-ultra-moon"], moon: ["generation-vii", "ultra-sun-ultra-moon"], "ultra-sun": ["generation-vii", "ultra-sun-ultra-moon"], "ultra-moon": ["generation-vii", "ultra-sun-ultra-moon"] };
// Jogos agrupados: pares da mesma geração ficam juntos e as DLCs entram no jogo original.
const GROUPS = [
  { id: "rb", gen: "I", name: "Red / Blue", vs: ["red", "blue"] },
  { id: "y", gen: "I", name: "Yellow", vs: ["yellow"] },
  { id: "gs", gen: "II", name: "Gold / Silver", vs: ["gold", "silver"] },
  { id: "c", gen: "II", name: "Crystal", vs: ["crystal"] },
  { id: "rs", gen: "III", name: "Ruby / Sapphire", vs: ["ruby", "sapphire"] },
  { id: "e", gen: "III", name: "Emerald", vs: ["emerald"] },
  { id: "frlg", gen: "III", name: "FireRed / LeafGreen", vs: ["firered", "leafgreen"] },
  { id: "cxd", gen: "III", name: "Colosseum / XD", vs: ["colosseum", "xd"] },
  { id: "dp", gen: "IV", name: "Diamond / Pearl", vs: ["diamond", "pearl"] },
  { id: "pt", gen: "IV", name: "Platinum", vs: ["platinum"] },

  { id: "xy", gen: "VI", name: "X / Y", vs: ["x", "y"] },

  { id: "usum", gen: "VII", name: "Ultra Sun / Ultra Moon", vs: ["ultra-sun", "ultra-moon"] },

  { id: "swsh", gen: "VIII", name: "Sword / Shield", vs: ["sword", "shield"], dlc: ["the-isle-of-armor", "the-crown-tundra"] },
  { id: "bdsp", gen: "VIII", name: "Brilliant Diamond / Shining Pearl", vs: ["brilliant-diamond", "shining-pearl"] },
  { id: "pla", gen: "VIII", name: "Legends: Arceus", vs: ["legends-arceus"] },
  { id: "sv", gen: "IX", name: "Scarlet / Violet", vs: ["scarlet", "violet"], dlc: ["the-teal-mask", "the-indigo-disk"] }
];
let curGames = [];
const G = () => curGames.find(g => g.id === game);
const allVers = g => [...g.vs, ...(g.dlc || [])];

function gamesOf() {
  const set = new Set();
  (mon.sp ? mon.sp.flavor_text_entries : []).forEach(e => { if (e.language.name === "en") set.add(e.version.name); });
  mon.enc.forEach(l => l.version_details.forEach(v => set.add(v.version.name)));
  const known = new Set(GROUPS.flatMap(allVers));
  return GROUPS.filter(g => allVers(g).some(v => set.has(v))).concat([...set].filter(v => !known.has(v)).map(v => ({ id: v, gen: "Outros", name: gname(v), vs: [v] })));
}
function artFor(g) {
  const s = mon.sprites, e = g && SPR[g.vs[0]], v = e && s.versions && s.versions[e[0]] && s.versions[e[0]][e[1]];
  if (v) { const a = (v.animated && v.animated.front_default) || v.front_default; if (a) return [a, true]; }
  return [((s.other || {})["official-artwork"] || {}).front_default || ((s.other || {}).home || {}).front_default || s.front_default, false];
}
function descFor(g) {
  const fl = mon.sp ? mon.sp.flavor_text_entries.filter(e => e.language.name === "en") : [];
  const e = (g && (fl.find(x => g.vs.includes(x.version.name)) || fl.find(x => (g.dlc || []).includes(x.version.name)))) || fl[fl.length - 1];
  return e ? e.flavor_text.replace(/[\n\f\u00ad]/g, " ").replace(/\s+/g, " ").trim() : "";
}
function locsFor(g) {
  if (!g) return [];
  const out = [];
  mon.enc.forEach(l => {
    const base = [], dlc = [], det = [];
    l.version_details.forEach(v => { const n = v.version.name; if (g.vs.includes(n)) base.push(n); else if ((g.dlc || []).includes(n)) dlc.push(n); else return; det.push(v); });
    if (!det.length) return;
    let lo = 999, hi = 0, ch = 0; const ms = new Set();
    det.forEach(v => { ch = Math.max(ch, v.max_chance); v.encounter_details.forEach(d => { lo = Math.min(lo, d.min_level); hi = Math.max(hi, d.max_level); ms.add(pretty(d.method.name)); }); });
    let tag = "";
    if (!base.length) tag = "DLC · " + dlc.map(gname).join(", ");
    else if (g.vs.length > 1 && base.length < g.vs.length) tag = "só " + base.map(gname).join(", ");
    out.push({ n: pretty(l.location_area.name.replace(/-area$/, "")), lv: [lo, hi], m: [...ms].join(", "), ch, tag, dlc: !base.length });
  });
  return out.sort((a, b) => a.dlc - b.dlc);
}
const availCache = {};
async function availSpecies(g) {
  if (!g) return null;
  if (availCache[g.id]) return availCache[g.id];
  const vgs = new Set(), dexes = new Set(), ids = new Set();
  await Promise.all(allVers(g).map(async v => { try { vgs.add((await j(`${POKEAPI}/version/${v}`)).version_group.url); } catch (e) {} }));
  await Promise.all([...vgs].map(async u => { try { (await j(u)).pokedexes.forEach(d => dexes.add(d.url)); } catch (e) {} }));
  await Promise.all([...dexes].map(async u => { try { (await j(u)).pokemon_entries.forEach(e => ids.add(+e.pokemon_species.url.split("/").filter(Boolean).pop())); } catch (e) {} }));
  return ids.size ? (availCache[g.id] = ids) : null;
}
function renderGame() {
  const g = G(), [src, pix] = artFor(g), img = $("art");
  img.src = src; img.style.imageRendering = pix ? "pixelated" : "auto";
  const d = descFor(g), el = $("desc");
  el.dataset.tr = d; el.textContent = d;
  if (d) translateAll($("hdr"), renderTab.id);
  const L = locsFor(g);
  $("locs").innerHTML = L.length
    ? L.map(x => `<div class="loc"><span><b>${esc(x.n)}</b>${x.tag ? `<span class="tg${x.dlc ? " dlc" : ""}">${esc(x.tag)}</span>` : ""}</span><span class="mute">${x.lv[1] ? "Lv " + (x.lv[0] === x.lv[1] ? x.lv[0] : x.lv[0] + "–" + x.lv[1]) + " · " : ""}${esc(x.m)} · ${x.ch}%</span></div>`).join("")
    : '<p class="mute" style="margin:0">A PokéAPI não tem locais para este jogo (pode ser presente, troca, evento ou um jogo sem esses dados).</p>';
}

function shell() {
  const m = mon;
  curGames = gamesOf();
  if (!curGames.some(g => g.id === game)) game = curGames.length ? curGames[curGames.length - 1].id : "";
  const gens = [...new Set(curGames.map(g => g.gen))];
  const sel = curGames.length ? `<select id="game" aria-label="Jogo">${gens.map(gn => `<optgroup label="${gn === "Outros" ? "Outros" : "Geração " + gn}">${curGames.filter(g => g.gen === gn).map(g => `<option value="${g.id}"${g.id === game ? " selected" : ""}>${esc(g.name)}</option>`).join("")}</optgroup>`).join("")}</select>` : "";
  const genus = m.sp ? ((m.sp.genera || []).find(x => x.language.name === "en") || {}).genus : "";
  return `<div class="card hd" id="hdr">
  <div class="top"><img id="art" alt="${esc(pretty(m.name))}"><div class="hr"><h2>${esc(pretty(m.name))} <small class="mute">#${m.id}${genus ? " · " + esc(genus) : ""}</small></h2><div>${m.types.map(t => badge(t.type.name)).join("")}</div></div></div>
  <div class="mid"><div class="sts">${m.stats.map((s, i) => `<div class="s"><span>${NS[i]}</span><b>${s.base_stat}</b><div class="bar"><i style="width:${Math.min(100, s.base_stat / 1.6)}%"></i></div></div>`).join("")}</div>
  <div class="bubble"><p id="desc"></p></div></div>
  <div class="where"><div class="wh"><b>Onde encontrar</b>${sel}</div><div id="locs" class="locs"></div></div></div>
  <div class="tabs" role="tablist">${MODES.map(x => `<button class="tab" role="tab" data-m="${x[0]}" aria-selected="${x[0] === mode}">${x[1]}</button>`).join("")}</div><div id="tab"></div>`;
}

async function renderTab() {
  const t = $("tab"), my = ++renderTab.id; t.innerHTML = '<p class="mute">Carregando…</p>';
  let html;
  try { html = mode === "casual" ? await casual() : await competitive(mode); }
  catch (e) { html = `<div class="card">Não foi possível carregar os dados competitivos (${esc(e.message)}). Veja direto no <a href="https://www.pikalytics.com/pokedex" target="_blank" rel="noopener">Pikalytics</a>.</div>`; }
  if (my === renderTab.id) { t.innerHTML = html; translateAll(t, my); }
}
renderTab.id = 0;

async function show(raw) {
  const id = raw.trim().toLowerCase().replace(/\s+/g, "-");
  if (!id) return;
  $("out").innerHTML = '<p class="mute">Buscando…</p>';
  try { mon = await j(`${POKEAPI}/pokemon/${id}`); }
  catch { $("out").innerHTML = `<div class="card">Não encontrei "${esc(raw)}". Confira o nome (em inglês).</div>`; return; }
  $("q").value = pretty(mon.name);
  const [sp, enc] = await Promise.all([j(mon.species.url).catch(() => null), j(mon.location_area_encounters).catch(() => [])]);
  mon.sp = sp; mon.enc = enc || [];
  $("out").innerHTML = shell(); renderGame(); renderTab();
}

document.addEventListener("change", e => { if (e.target.id === "game") { game = e.target.value; renderGame(); if (mode === "casual") renderTab(); } });
document.addEventListener("click", e => {
  const n = e.target.closest("[data-n]"), t = e.target.closest("[data-m]");
  if (n) show(n.dataset.n);
  if (t && mon) { mode = t.dataset.m; document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.m === mode)); renderTab(); }
});
$("q").addEventListener("keydown", e => { if (e.key === "Enter") show($("q").value); });
$("q").addEventListener("change", () => show($("q").value));

j(`${POKEAPI}/pokemon?limit=1100`).then(d => { $("names").innerHTML = d.results.map(r => `<option value="${esc(pretty(r.name))}">`).join(""); }).catch(() => {});
$("foot").innerHTML = 'Dados: <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a> e estatísticas do <a href="https://www.smogon.com/stats/" target="_blank" rel="noopener">Smogon</a>.';
