name: Atualizar estatisticas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 5 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_stats.py
      - name: Salvar no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Atualiza estatisticas" && git push)
